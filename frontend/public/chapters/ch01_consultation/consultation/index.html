<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>양도소득세 상담 · TAXFLOW</title><link rel="stylesheet" href="styles.css?v=27"><script src="app.js?v=14" defer></script></head><body><header class="topbar"><a class="brand" href="../../../index.html"><span class="brand-mark">tf</span> TAXFLOW</a><nav><a href="../">챕터 01</a></nav></header><main class="layout"><section class="intro"><div class="eyebrow">상담 접수</div><h1>양도소득세 상담</h1><p>신고자에게 질문하며 아는 내용부터 입력하세요. 모르는 내용은 확인 필요로 남길 수 있습니다. 기록을 선택하거나 저장한 뒤 상단의 보고서 보기에서 인쇄·PDF 저장을 할 수 있습니다.</p></section><div class="workspace"><form id="consultation-form" class="form-panel"><div class="panel-heading form-toolbar"><div class="form-actions"><button type="button" class="secondary" id="load-sample">가상 데이터 입력</button><button type="button" class="secondary" id="new-record">새 상담</button><button type="button" class="secondary" id="open-report" disabled title="상담을 저장한 뒤 보고서를 열 수 있습니다">보고서 보기</button><button type="submit" class="primary">상담 저장</button></div></div><p id="message" role="status"></p><section class="question-group"><h2>납세자 정보</h2><div class="field-grid taxpayer-grid"><label>신고자 성명 <span class="required">*</span><input name="taxpayerName" type="text" required></label><label>생년월일<input name="birthDate" type="date"></label><label>국내 거주자 여부<select name="resident"><option value="">선택하세요</option><option>예</option><option>아니요</option><option>확인 필요</option></select></label><label>소유 형태<select name="ownership"><option value="">선택하세요</option><option>단독 소유</option><option>공동 소유</option><option>확인 필요</option></select></label></div></section><section class="question-group"><h2>어떤 주택을 양도하셨나요?</h2><div class="field-grid"><label>주택 주소<input name="address" type="text"></label><label>상세 주소<input name="addressDetail" type="text"></label><label>주택 종류<select name="propertyType"><option value="">선택하세요</option><option>아파트</option><option>단독·다가구</option><option>다세대·연립</option><option>기타</option><option>확인 필요</option></select></label></div></section><section class="question-group"><h2>언제 얼마에 취득하셨나요?</h2><div class="field-grid"><label>취득 방법<select name="acquisitionMethod"><option value="">선택하세요</option><option>매매</option><option>상속</option><option>증여</option><option>기타</option><option>확인 필요</option></select></label><label>취득 계약일<input name="acquisitionContractDate" type="date"></label><label>취득 잔금일<input name="acquisitionBalanceDate" type="date"></label><label>취득 등기접수일<input name="acquisitionRegistrationDate" type="date"></label><label>취득가액 (원)<span class="amount-control"><input name="acquisitionPrice" type="text" inputmode="numeric" autocomplete="off"><span class="amount-buttons"><button type="button" data-amount-step="100000000" data-amount-field="acquisitionPrice" aria-label="취득가액 1억 원 올리기">▲</button><button type="button" data-amount-step="-100000000" data-amount-field="acquisitionPrice" aria-label="취득가액 1억 원 내리기">▼</button></span></span></label></div></section><section class="question-group"><h2>언제 얼마에 양도하셨나요?</h2><div class="field-grid"><label>진행 상태<select name="transferStatus"><option value="">선택하세요</option><option>양도 완료</option><option>양도 예정</option><option>확인 필요</option></select></label><label>양도 계약일<input name="transferContractDate" type="date"></label><label>양도 잔금일<input name="transferBalanceDate" type="date"></label><label>양도 등기접수일<input name="transferRegistrationDate" type="date"></label><label>양도가액 (원)<span class="amount-control"><input name="transferPrice" type="text" inputmode="numeric" autocomplete="off"><span class="amount-buttons"><button type="button" data-amount-step="100000000" data-amount-field="transferPrice" aria-label="양도가액 1억 원 올리기">▲</button><button type="button" data-amount-step="-100000000" data-amount-field="transferPrice" aria-label="양도가액 1억 원 내리기">▼</button></span></span></label></div></section><section class="question-group"><h2>이 주택에 실제로 거주하셨나요?</h2><div class="field-grid"><label>실제 거주 여부<select name="livedThere"><option value="">선택하세요</option><option>예</option><option>아니요</option><option>확인 필요</option></select></label><label>입주일<input name="moveInDate" type="date"></label><label>퇴거일<input name="moveOutDate" type="date"></label><label>주민등록 이력과 실제 거주 일치<select name="registrationMatch"><option value="">선택하세요</option><option>예</option><option>아니요</option><option>확인 필요</option></select></label><label>추가 거주 이력<textarea name="residenceDetails" rows="2"></textarea></label></div></section><section class="question-group"><h2>함께 사는 가족과 다른 주택이 있나요?</h2><div class="field-grid household-grid"><label>세대 구성<input name="household" type="text"></label><label>세대원의 다른 주택·지분 보유<select name="otherHomes"><option value="">선택하세요</option><option>있음</option><option>없음</option><option>확인 필요</option></select></label><label>세대원의 입주권·분양권 보유<select name="otherRights"><option value="">선택하세요</option><option>있음</option><option>없음</option><option>확인 필요</option></select></label><label>보유 현황 상세<textarea name="householdDetails" rows="2"></textarea></label></div></section><section class="question-group"><h2>전출 후 어디에 거주하시나요?</h2><div class="field-grid"><label>현재 거주 형태<select name="currentHousing"><option value="">선택하세요</option><option>자가</option><option>임차</option><option>기타</option><option>확인 필요</option></select></label><label>전출 후 대상 주택 사용<select name="propertyAfterMove"><option value="">선택하세요</option><option>공실</option><option>임대</option><option>가족 거주</option><option>기타</option><option>확인 필요</option></select></label></div></section><section class="question-group"><h2>비용과 다른 양도가 있나요?</h2><div class="field-grid expense-grid"><label>취득세 등 필요경비 (원)<span class="amount-control"><input name="expenses" type="text" inputmode="numeric" autocomplete="off"><span class="amount-buttons"><button type="button" data-amount-step="10000000" data-amount-field="expenses" aria-label="필요경비 1천만 원 올리기">▲</button><button type="button" data-amount-step="-10000000" data-amount-field="expenses" aria-label="필요경비 1천만 원 내리기">▼</button></span></span></label><label>같은 해 다른 자산 양도<select name="otherTransfers"><option value="">선택하세요</option><option>있음</option><option>없음</option><option>확인 필요</option></select></label><label>비용·다른 양도 상세<textarea name="expenseDetails" rows="2"></textarea></label></div></section><section class="question-group"><h2>자료와 후속 확인</h2><div class="field-grid evidence-grid"><label>취득계약서<select name="acquisitionDocument"><option value="">선택하세요</option><option>받음</option><option>요청 예정</option><option>확인 필요</option></select></label><label>양도계약서<select name="transferDocument"><option value="">선택하세요</option><option>받음</option><option>요청 예정</option><option>확인 필요</option></select></label><label>주민등록초본<select name="residentDocument"><option value="">선택하세요</option><option>받음</option><option>요청 예정</option><option>확인 필요</option></select></label><label>대금자료<select name="paymentDocument"><option value="">선택하세요</option><option>받음</option><option>요청 예정</option><option>확인 필요</option></select></label><label>세무사에게 전달할 내용<textarea name="notes" rows="2"></textarea></label></div></section></form><aside class="summary-panel"><div class="summary-heading"><h2>상담 현황</h2></div><input id="search" type="search" aria-label="납세자 이름 검색" placeholder="납세자 이름"><div id="records" class="records"></div></aside></div></main></body></html>
