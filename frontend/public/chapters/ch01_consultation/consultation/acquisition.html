<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>취득계약서 분석 · TAXFLOW</title><link rel="stylesheet" href="acquisition.css?v=10"></head>
<body><main><header><div><p class="eyebrow">TAXFLOW / CONSULTATION</p><h1 id="contract-page-title">취득계약서 분석</h1><p class="notice">최대 20MB. 금액, 날짜, 인적사항은 반드시 원본과 대조하세요.</p><p id="contract-guidance" class="notice" hidden>취득계약서의 매수인이 양도계약서의 매도인인지, 양도계약서의 매수인과 매매대금이 맞는지 원본과 대조하세요.</p></div><div class="header-actions"><button type="button" id="contract-close" class="secondary" hidden>닫기</button></div></header>
<p id="consultation-save-warning" class="consultation-save-warning" role="alert" hidden></p>
<section class="toolbar"><label class="file-label"><span id="file-label-text">PDF 등록</span><input id="file" type="file" accept="application/pdf,.pdf"></label><span id="filename">선택된 파일 없음</span><label class="model-label" for="model">분석 모델</label><select id="model"><option value="4b">Qwen3-VL 4B · 빠른 분석</option><option value="8b" selected>Qwen3-VL 8B · 기존 모델</option></select><button id="parse" disabled>다시 분석</button></section>
<div class="status-row" id="status-row"><p id="status" role="status" aria-live="polite">PDF를 선택해 주세요.</p><span id="elapsed-summary" aria-live="off" hidden></span></div>

<div class="columns"><section class="panel"><div class="panel-head"><div><span class="overline">ORIGINAL</span><h2>원본 문서</h2></div><div class="pager"><button id="prev" class="secondary" disabled>이전</button><span id="page">0 / 0</span><button id="next" class="secondary" disabled>다음</button></div></div><div class="preview" id="preview"><span>PDF를 선택하면 원본이 표시됩니다.</span><img id="image" alt="계약서 페이지 원본" hidden></div></section>
<section class="panel"><div class="panel-head result-head"><div><span class="overline">EXTRACTED</span><h2>분석 결과</h2><p class="result-help">내용을 확인하고 필요한 부분을 직접 수정할 수 있습니다.</p></div><section id="storage" class="storage" hidden><button id="saveReview" class="secondary" type="button" disabled>수정 결과 저장</button><button id="confirmReview" type="button" disabled>원본 확인 완료</button></section></div><div id="renderedResult" class="rendered-result" aria-label="핵심 정보"></div><div id="analysis-progress" class="rendered-result analysis-progress" role="status" aria-live="polite" hidden><div><p id="analysis-progress-message"></p><span id="elapsed" aria-live="off">경과 시간 00:00</span></div></div></section></div>
</main><dialog id="review-confirmation" aria-labelledby="review-confirmation-title"><h2 id="review-confirmation-title">확인 결과를 저장했습니다</h2><div class="review-confirmation-actions"><form method="dialog"><button type="submit" autofocus>확인</button></form></div></dialog><script src="/assets/js/payment-utils.js?v=1"></script><script src="acquisition.js?v=15"></script></body></html>
