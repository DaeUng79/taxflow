<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주민등록초본 분석</title><link rel="stylesheet" href="acquisition.css?v=15"><link rel="stylesheet" href="resident.css?v=2"></head><body><main><header><div><p class="eyebrow">TAXFLOW / CONSULTATION</p><h1>주민등록초본 분석</h1><p class="notice">과거 주소변동사항이 포함된 초본을 선택해 주세요. 주민등록 이력은 실제 거주를 확정하지 않습니다.</p></div><button id="close" class="secondary" type="button">닫기</button></header><section class="toolbar"><label class="file-label">PDF 등록<input id="file" type="file" accept="application/pdf,.pdf"></label><span id="filename">선택된 파일 없음</span><label>분석 모델 <select id="model"><option value="8b">Qwen3-VL 8B</option><option value="4b">Qwen3-VL 4B</option></select></label><button id="analyze" disabled type="button">다시 분석</button></section><div class="status-row"><p id="status" role="status">PDF를 선택해 주세요.</p><span id="elapsed-summary" hidden></span></div><div class="columns"><section class="panel"><div class="panel-head"><h2>원본 문서</h2><div class="pager"><button id="prev" type="button">이전</button><span id="page">0 / 0</span><button id="next" type="button">다음</button></div></div><div class="preview"><img id="image" alt="주민등록초본 원본" hidden></div></section><section class="panel"><h2>주소 변동 이력</h2><p class="resident-info">취득·양도 계약일 중 빠른 연도부터의 전입·도로명주소 이력을 표시합니다. 원본과 대조해 내용을 확인해 주세요.</p><p id="year-filter" class="resident-info"></p><div id="result"></div><button id="add-row" class="secondary" type="button" disabled>주소 이력 추가</button></section></div><section class="consultation-review"><div><strong>확인 후 상담에 저장</strong><p>주소 일치 여부와 전입 이력을 상담 화면에 표시합니다. 실제 거주 여부는 직접 확인해 주세요.</p></div><div class="resident-actions"><button id="save" type="button" disabled>내용 확인 및 상담 저장</button></div></section></main><script src="/assets/js/payment-utils.js?v=1"></script><script src="resident.js?v=7"></script></body></html>
